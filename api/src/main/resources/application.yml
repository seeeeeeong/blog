server:
  shutdown: graceful
  # Loopback: only the tunnel and the web app on the same host should reach it.
  address: ${BLOG_API_HOST:127.0.0.1}
  port: ${BLOG_API_PORT:8150}
  # X-Forwarded-* decide the scheme behind the tunnel. Safe only because nothing but the proxy
  # reaches the api, which replaces those headers.
  forward-headers-strategy: framework
  servlet:
    session:
      # An unfinished GitHub sign-in lapses this soon; signing in stretches the session to its cookie's age.
      timeout: 10m
      cookie:
        name: blog_session
        # The owner signs in again every two weeks.
        max-age: 14d
        # Not Strict: GitHub's redirect back is a cross-site navigation that must carry the cookie.
        same-site: lax
        http-only: true
        # The api never sees TLS itself, so it is set, not inferred; off only for local http.
        secure: ${BLOG_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: blog-api
  config:
    import: optional:file:.env[.dotenv]
  datasource:
    url: ${BLOG_DB_URL:jdbc:postgresql://127.0.0.1:55436/blog}
    username: ${BLOG_DB_USER:blog}
    password: ${BLOG_DB_PASSWORD:blog}
  flyway:
    validate-on-migrate: true
  session:
    jdbc:
      # Flyway owns the tables.
      initialize-schema: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

blog:
  # The origin the browser sees: GitHub sends the owner back here, and sign-in lands on its /admin.
  public-url: ${BLOG_PUBLIC_URL:http://localhost:3150}
  auth:
    admin-github-login: ${BLOG_ADMIN_GITHUB_LOGIN:seeeeeeong}
    github:
      # Empty: admin sign-in is off, and everything public still works.
      client-id: ${BLOG_GITHUB_CLIENT_ID:}
      client-secret: ${BLOG_GITHUB_CLIENT_SECRET:}
      url: https://github.com
      api-url: https://api.github.com
  deepseek:
    base-url: https://api.deepseek.com
    # The owner's key; empty, drafts from a memo and Ask answer 503.
    api-key: ${BLOG_DEEPSEEK_API_KEY:}
    # Between pieces of a stream: DeepSeek sends a keep-alive while a request queues, and many pieces a
    # second once it writes, so half a minute of silence is a dead stream.
    idle-timeout: 30s
  claude:
    base-url: https://api.anthropic.com
    # The owner's key; empty, a use set to a Claude model answers 503.
    api-key: ${BLOG_ANTHROPIC_API_KEY:}
    # Between pieces of a stream: Anthropic pings while the model thinks, so two minutes of silence is a dead stream.
    idle-timeout: 120s
  llm:
    # Writing and reviewing drafts from a memo, per calendar month in Korea.
    monthly-cap-usd: 10
    # Readers' questions, apart from the owner's: at the cap Ask closes until the month ends.
    ask-monthly-cap-usd: 30
    # Prices at peak, from api-docs.deepseek.com/quick_start/pricing on 2026-11-04; every input token
    # priced as a cache miss, so the estimate is never below the bill.
    memo:
      model: deepseek-flash
      input-per-million-usd: 0.30
      output-per-million-usd: 1.20
    review:
      model: deepseek-v4-pro
      input-per-million-usd: 1.32
      output-per-million-usd: 3.96
    ask:
      model: deepseek-flash
      input-per-million-usd: 0.30
      output-per-million-usd: 1.20
  ask:
    # The key a reader's address is hashed with, mixed with the day, for the daily count. Empty, a random
    # key is made at start, so a restart starts the day's counts over.
    ip-salt: ${BLOG_ASK_IP_SALT:}
