server:
  shutdown: graceful
  # Loopback: only the tunnel and the web app on the same host should reach it.
  address: ${BLOG_API_HOST:127.0.0.1}
  port: ${BLOG_API_PORT:8150}
  # X-Forwarded-* decide the scheme behind the tunnel. Safe only because nothing but the proxy
  # reaches the api, which replaces those headers.
  forward-headers-strategy: framework
  servlet:
    session:
      # An unfinished GitHub sign-in lapses this soon; signing in stretches the session to its cookie's age.
      timeout: 10m
      cookie:
        name: blog_session
        # The owner signs in again every two weeks.
        max-age: 14d
        # Not Strict: GitHub's redirect back is a cross-site navigation that must carry the cookie.
        same-site: lax
        http-only: true
        # The api never sees TLS itself, so it is set, not inferred; off only for local http.
        secure: ${BLOG_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: blog-api
  config:
    import: optional:file:.env[.dotenv]
  datasource:
    url: ${BLOG_DB_URL:jdbc:postgresql://127.0.0.1:55436/blog}
    username: ${BLOG_DB_USER:blog}
    password: ${BLOG_DB_PASSWORD:blog}
  flyway:
    validate-on-migrate: true
  session:
    jdbc:
      # Flyway owns the tables.
      initialize-schema: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

blog:
  # The origin the browser sees: GitHub sends the owner back here, and sign-in lands on its /admin.
  public-url: ${BLOG_PUBLIC_URL:http://localhost:3150}
  auth:
    admin-github-login: ${BLOG_ADMIN_GITHUB_LOGIN:seeeeeeong}
    github:
      # Empty: admin sign-in is off, and everything public still works.
      client-id: ${BLOG_GITHUB_CLIENT_ID:}
      client-secret: ${BLOG_GITHUB_CLIENT_SECRET:}
      url: https://github.com
      api-url: https://api.github.com
  yes24:
    base-url: https://apis.yes24.com/v1
    # The owner's key for YES24's Open API; empty, book search and import answer 503.
    api-key: ${BLOG_YES24_API_KEY:}
  book-source:
    # YES24's basic tier allows a key 10 calls a second and 20,000 a day. Under both, so a second that
    # falls across two of theirs, or a restart that forgets the day's count, still fits.
    per-second: 8
    per-day: 18000
  deepseek:
    base-url: https://api.deepseek.com
    # The owner's key; empty, study notes and drafts from a memo answer 503.
    api-key: ${BLOG_DEEPSEEK_API_KEY:}
    model: deepseek-flash
    # An 8,192-token answer arrives whole, after a minute or more at a busy hour.
    read-timeout: 120s
  llm:
    # Study notes and drafts from a memo together, per calendar month in Korea.
    monthly-cap-usd: 10
    # deepseek-flash at peak, from api-docs.deepseek.com/quick_start/pricing on 2026-10-29; every input
    # token priced as a cache miss, so the estimate is never below the bill.
    price:
      input-per-million-usd: 0.30
      output-per-million-usd: 1.20
