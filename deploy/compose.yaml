# The blog on the home server, in /opt/blog. Images come from GHCR; nothing is built here.
# No port is published: the tunnel is the only way in.
name: blog

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${BLOG_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [db]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/seeeeeeong/blog-api:${BLOG_TAG:-main}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside its own container; still unpublished.
      BLOG_API_HOST: 0.0.0.0
      BLOG_DB_URL: jdbc:postgresql://postgres:5432/blog
      BLOG_DB_USER: blog
      BLOG_DB_PASSWORD: ${BLOG_DB_PASSWORD:?}
      BLOG_PUBLIC_URL: ${BLOG_PUBLIC_URL:?}
      BLOG_COOKIE_SECURE: "true"
      BLOG_ADMIN_GITHUB_LOGIN: ${BLOG_ADMIN_GITHUB_LOGIN:-seeeeeeong}
      BLOG_GITHUB_CLIENT_ID: ${BLOG_GITHUB_CLIENT_ID:-}
      BLOG_GITHUB_CLIENT_SECRET: ${BLOG_GITHUB_CLIENT_SECRET:-}
      BLOG_YES24_API_KEY: ${BLOG_YES24_API_KEY:-}
      BLOG_DEEPSEEK_API_KEY: ${BLOG_DEEPSEEK_API_KEY:-}
      BLOG_ASK_IP_SALT: ${BLOG_ASK_IP_SALT:-}
    # db reaches postgres; default reaches GitHub for the admin's sign-in, YES24 for books and DeepSeek.
    networks: [db, default]
    # The JVM sizes its heap from this; see api/Dockerfile.
    mem_limit: 768m
    # Graceful shutdown lets requests in flight finish.
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8150/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      # Flyway and Hibernate run before the first answer.
      start_period: 90s

  web:
    image: ghcr.io/seeeeeeong/blog-web:${BLOG_TAG:-main}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Server components read it at run time; /api/* rewrites were fixed to it at build time.
      BLOG_API_URL: http://api:8150
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3150/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    # The public hostname's route (http://web:3150) lives in the tunnel's dashboard config.
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    mem_limit: 128m

networks:
  db:
    # No way out: postgres needs nothing beyond the api.
    internal: true

volumes:
  postgres-data:
