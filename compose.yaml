# Fixed, so the volume keeps its name wherever the repository is cloned.
name: blog

services:
  postgres:
    image: postgres:18-alpine
    profiles: [local]
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
    ports:
      # 55432 to 55435 are taken by other local projects.
      - "127.0.0.1:55436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
