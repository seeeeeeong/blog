name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew check --console=plain

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm build

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The action lists the PR's commits through the API; 403 without this.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # A secret committed and then deleted is still published.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A pull request builds the images to prove them; main also pushes them for the server to pull.
  api-image:
    needs: [api, web, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew :api:bootJar --console=plain

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: api
          # The home server is an Intel N100.
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/seeeeeeong/blog-api:main
            ghcr.io/seeeeeeong/blog-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  web-image:
    needs: [api, web, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: web
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/seeeeeeong/blog-web:main
            ghcr.io/seeeeeeong/blog-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Inlined by Next: the footer's commit and the RSS feed's origin.
          build-args: |
            NEXT_PUBLIC_COMMIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'http://localhost:3150' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # The server's stacks live in the private homelab repository; its Deploy workflow pulls these images.
  deploy:
    needs: [api-image, web-image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # The token may only run workflows in homelab, so it cannot look up the default branch the
      # way `gh workflow run` does; the REST call names it. The workflow checks the stack and tag.
      - env:
          GH_TOKEN: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
          TAG: ${{ github.sha }}
        run: >-
          gh api --method POST repos/seeeeeeong/homelab/actions/workflows/deploy.yml/dispatches
          -f ref=main -f inputs[stack]=blog -f "inputs[tag]=$TAG"
